name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 0 * * *" # Daily certificate check
    - cron: "0 3 * * 0" # Weekly backup restore drill (Sundays 03:00 UTC)

jobs:
  cert-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Verify package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Certificate Expiry Check
        run: npm run check-cert
        continue-on-error: true

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bridge-starter-node/package-lock.json

      - name: Verify package-lock.json files exist
        run: |
          set -euo pipefail
          for dir in . bridge-starter-node; do
            if [ ! -f "${dir}/package-lock.json" ]; then
              echo "⚠️ ${dir}/package-lock.json not found, generating it..."
              (cd "${dir}" && npm install --package-lock-only)
            else
              echo "✅ ${dir}/package-lock.json found"
            fi
          done

      - name: Generate CycloneDX SBOMs (direct + transitive)
        run: |
          set -euo pipefail
          mkdir -p sbom
          # Root backend SBOM
          npx --yes @cyclonedx/cyclonedx-npm@^1 \
            --output-format JSON \
            --output-file sbom/backend-root.cdx.json \
            --package-lock-only
          # bridge-starter-node SBOM
          npx --yes @cyclonedx/cyclonedx-npm@^1 \
            --output-format JSON \
            --output-file sbom/backend-bridge-starter-node.cdx.json \
            --package-lock-only \
            --package-lock-only-dir bridge-starter-node
          echo "Generated SBOMs:"
          ls -l sbom/

      - name: Attach SBOM metadata to build artifacts
        run: |
          set -euo pipefail
          for f in sbom/*.cdx.json; do
            node -e "
              const fs = require('fs');
              const p = process.argv[1];
              const doc = JSON.parse(fs.readFileSync(p, 'utf8'));
              doc.metadata = doc.metadata || {};
              doc.metadata.component = doc.metadata.component || {};
              doc.metadata.properties = doc.metadata.properties || [];
              doc.metadata.properties.push(
                { name: 'build.commit', value: process.env.GITHUB_SHA },
                { name: 'build.run_id', value: process.env.GITHUB_RUN_ID },
                { name: 'build.run_attempt', value: process.env.GITHUB_RUN_ATTEMPT },
                { name: 'build.ref', value: process.env.GITHUB_REF }
              );
              fs.writeFileSync(p, JSON.stringify(doc, null, 2));
            " "$f"
          done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          retention-days: 90
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bridge-starter-node/package-lock.json

      - name: Verify root package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "⚠️ package-lock.json not found, generating it..."
            npm install --package-lock-only
          else
            echo "✅ package-lock.json found"
          fi

      - name: Install root dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run root npm audit for high vulnerabilities
        run: npm run audit:high
        continue-on-error: true

      - name: Check if Snyk is configured
        id: check_snyk
        run: |
          if [ -n "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "snyk_available=true" >> $GITHUB_OUTPUT
          else
            echo "snyk_available=false" >> $GITHUB_OUTPUT
            echo "⚠️ SNYK_TOKEN not configured. Skipping Snyk scan."
            echo "To enable Snyk scanning, add SNYK_TOKEN secret."
          fi

      - name: Setup Snyk CLI
        if: steps.check_snyk.outputs.snyk_available == 'true'
        uses: snyk/actions/setup@v1.0.0

      - name: Run root Snyk test for high vulnerabilities
        if: steps.check_snyk.outputs.snyk_available == 'true'
        run: npm run snyk:test:high
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Verify bridge-starter-node package-lock.json exists
        working-directory: bridge-starter-node
        run: |
          if [ ! -f package-lock.json ]; then
            echo "⚠️ bridge-starter-node/package-lock.json not found, generating it..."
            npm install --package-lock-only
          else
            echo "✅ bridge-starter-node/package-lock.json found"
          fi

      - name: Install bridge-starter-node dependencies without lifecycle scripts
        working-directory: bridge-starter-node
        run: npm ci --ignore-scripts

      - name: Run bridge-starter-node npm audit for high vulnerabilities
        working-directory: bridge-starter-node
        run: npm run audit:high
        continue-on-error: true

      - name: Run bridge-starter-node Snyk test for high vulnerabilities
        if: steps.check_snyk.outputs.snyk_available == 'true'
        working-directory: bridge-starter-node
        run: npm run snyk:test:high
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Enforce vulnerability triage and exception expiry
        run: |
          set -euo pipefail
          # Vulnerability triage policy:
          #   - Critical/High findings must be triaged within 7 days.
          #   - Medium findings must be triaged within 30 days.
          #   - Low findings are tracked but not blocking.
          # Exceptions live in .security/sbom-exceptions.json and MUST include
          # an ISO-8601 `expires` date. Expired exceptions fail this job so
          # they cannot silently persist past their review window.
          EXCEPTIONS_FILE=".security/sbom-exceptions.json"
          if [ ! -f "${EXCEPTIONS_FILE}" ]; then
            echo "No SBOM exceptions file present; nothing to expire."
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const file = process.argv[1];
            const now = new Date();
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            const exceptions = Array.isArray(data.exceptions) ? data.exceptions : [];
            const expired = [];
            for (const ex of exceptions) {
              if (!ex.expires) {
                expired.push((ex.id || ex.package || 'unknown') + ' (missing expires)');
                continue;
              }
              const exp = new Date(ex.expires);
              if (Number.isNaN(exp.getTime())) {
                expired.push((ex.id || ex.package || 'unknown') + ' (invalid expires)')
                continue;
              }
              if (exp.getTime() < now.getTime()) {
                expired.push((ex.id || ex.package || 'unknown') + ' expired ' + ex.expires);
              }
            }
            if (expired.length > 0) {
              console.error('::error::Expired or invalid SBOM vulnerability exceptions detected:');
              for (const e of expired) console.error(' - ' + e);
              process.exit(1);
            }
            console.log('All SBOM exceptions are valid and unexpired.');
          " "${EXCEPTIONS_FILE}"
